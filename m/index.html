/* This page is only the page: it never talks to guardianagroup.com after loading, and what
   it needs to reach the computer travels after «#», which the browser never sends to anyone.
   Everything said goes directly phone ↔ computer over TLS 1.3 pinned to the computer's own
   certificate (WebTransport) or, where the browser cannot do that (iPhone, iPad) or there is
   no way in, through GUARDIANA's relay (wss://rele.guardianagroup.com), sealed with AES-256-GCM
   under keys derived from the key in the QR code: the relay passes bytes it cannot read.
   No analytics, no cookies, no storage. */

@font-face{font-family:'IBM Plex Sans';font-weight:400 600;font-display:swap;src:url(/fonts/IBMPlexSans-400-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:swap;src:url(/fonts/IBMPlexSans-500-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:600;font-display:swap;src:url(/fonts/IBMPlexSans-600-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url(/fonts/IBMPlexMono-400-latin.woff2) format('woff2')}

@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--fg:#F4F6FA;--muted:#A5ACBF;--card:#141A2E;--line:#2A3250;--campo:#1A2140;--accent:#5C7CFF;--accent-fg:#0B1020;--accent-suave:#1C2652;--ok:#3CC79A;--aviso:#E3A54A;--alerta:#FF7A66}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.5 var(--texto);background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--card)}
header .marca{font:700 13px var(--display);letter-spacing:.02em}header .marca span{color:var(--muted);font-weight:500}
header .con{margin-left:auto;font-size:13px;color:var(--muted);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.estado{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.estado .punto{width:11px;height:11px;border-radius:50%;background:var(--line);flex:none}
.estado.protegida .punto{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.estado.revisar .punto{background:var(--aviso)}.estado.pausada .punto{background:var(--alerta)}
.estado b{font-weight:600;font-size:14px}.estado.protegida b{color:var(--ok)}.estado.revisar b{color:var(--aviso)}.estado.pausada b{color:var(--alerta)}
.estado small{color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--mono)}
main{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.pantalla{display:none;flex:1;flex-direction:column;padding:16px;gap:12px}.pantalla.activa{display:flex}
.codigo{display:grid;gap:10px;justify-items:center}.codigo b{font:700 26px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}.btn.sec{background:transparent;border:1px solid var(--linea,#3a4a6a)}
.numeros{display:flex;gap:10px;justify-content:center}.numeros b{font:700 28px/1 ui-monospace,Menlo,Consolas,monospace;background:rgba(255,255,255,.06);padding:12px 10px;border-radius:10px}
.campo{width:100%;max-width:320px;padding:10px 12px;border-radius:10px;border:1px solid var(--linea,#3a4a6a);background:rgba(0,0,0,.25);color:inherit;font-size:16px}
.aviso-sistema{font-size:12.5px;opacity:.8;max-width:360px}
.centro{justify-content:center;align-items:center;text-align:center;gap:14px}
.centro h1{margin:0;font:600 22px/1.25 var(--display);letter-spacing:-.01em}
.centro p{margin:0;color:var(--muted);max-width:30ch}
.giro{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:giro 1s linear infinite}@keyframes giro{to{transform:rotate(360deg)}}

.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font:500 12.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:12px 18px;border-radius:999px;cursor:pointer;touch-action:manipulation}
.btn.sec{background:transparent;color:var(--accent)}.btn.peligro{background:var(--alerta);border-color:var(--alerta);color:#fff}
.btn:disabled{opacity:.45}

.mensajes li{max-width:82%;padding:9px 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}
.mensajes li.mio{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.mensajes li time{display:block;font:10.5px var(--mono);opacity:.7;margin-top:2px}
.mensajes li.nota{align-self:center;background:transparent;border:0;color:var(--muted);font-size:12.5px;max-width:95%;text-align:center}
.escribir{display:flex;gap:8px}
.escribir input{flex:1;min-width:0;font:15px var(--texto);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--campo);color:var(--fg)}
.fila{display:flex;gap:8px;flex-wrap:wrap}
.llamada{display:none;flex-direction:column;gap:10px}.llamada.activa{display:flex}

.pantallas video{display:block}#remoto{width:100%;height:100%;object-fit:cover}

.l-estado{font:500 12px var(--mono);color:var(--muted)}
.nota-p{font-size:12.5px;color:var(--muted);margin:0;text-align:center}
.timbre{display:grid;gap:10px;padding:14px;border:1px solid var(--ok);border-radius:12px;background:color-mix(in srgb,var(--ok) 10%,var(--card))}.timbre[hidden]{display:none}.timbre b{font:600 17px/1.3 var(--display)}
.btn.contestar{background:var(--ok);border-color:var(--ok);color:#fff}
.llamando .pantallas{display:none}
footer{padding:8px 16px calc(8px + env(safe-area-inset-bottom));font:11px var(--mono);color:var(--muted);text-align:center;border-top:1px solid var(--line)}

<body>
<header><div class="marca">GUARDIANA <span>SECURE</span></div><div class="con" id="con"></div></header>
<div class="estado" id="estado" hidden><i class="punto"></i><b id="estado-palabra"></b><small id="estado-nota"></small></div>

  <section class="pantalla centro activa" id="p-conectando"><div class="giro"></div><h1 id="t-conectando"></h1><p id="t-conectando-p"></p></section>

  <section class="pantalla centro" id="p-espera"><div class="giro"></div><h1 id="t-espera"></h1><p id="t-espera-p"></p><div class="codigo" id="codigo-caja" hidden><b id="codigo"></b><div class="fila"><button class="btn" id="codigo-whatsapp"></button><button class="btn sec" id="codigo-copiar"></button></div></div></section>
  <section class="pantalla centro" id="p-nombre"><h1 id="t-nombre"></h1><p id="t-nombre-p"></p><input class="campo" id="mi-nombre" maxlength="40" autocomplete="given-name"><div class="fila"><button class="btn contestar" id="nombre-ok"></button></div></section>
  <section class="pantalla centro" id="p-numeros"><h1 id="t-numeros"></h1><p id="t-numeros-p"></p><div class="numeros" id="numeros"></div><input class="campo" id="nombre-otro" maxlength="60" autocomplete="off"><div class="fila"><button class="btn contestar" id="sas-si"></button><button class="btn peligro" id="sas-no"></button></div><p class="aviso-sistema" id="t-numeros-nota"></p></section>
  <section class="pantalla" id="p-chat">
    <div class="timbre" id="timbre" hidden aria-live="assertive"><b id="timbre-t"></b><div class="fila"><button class="btn contestar" id="contestar"></button><button class="btn peligro" id="rechazar"></button></div></div>
    <section class="llamada" id="llamada">
      <div class="pantallas"><video id="remoto" autoplay playsinline></video><video id="local" autoplay playsinline muted></video></div>
      <div class="fila"><span class="l-estado" id="l-estado"></span><button class="btn sec" id="silencio" aria-pressed="false"></button><button class="btn peligro" id="colgar"></button></div>
    </section>
    <ul class="mensajes" id="mensajes"></ul>
    <p class="nota-p" id="nota-iphone" hidden></p>
    <div class="fila" id="botones-llamar"><button class="btn sec" id="voz"></button><button class="btn sec" id="video"></button></div>
    <form class="escribir" id="form"><input id="texto" autocomplete="off" enterkeyhint="send"><button class="btn" id="enviar" type="submit"></button></form>
  </section>
</main>

    try { if (fuente && fuente.readyState === 'open') fuente.endOfStream(); } catch (_) {}
    fuente = null; buffer = null; pendientes = []; arrancando = false;
    $('remoto').removeAttribute('src');
    if (wake) { try { wake.release(); } catch (_) {} wake = null; }
  };
  $('voz').addEventListener('click', () => { manda({ t: 'llamar', video: false, mime: mime(false) }); });
  $('video').addEventListener('click', () => { manda({ t: 'llamar', video: true, mime: mime(true) }); });
  $('colgar').addEventListener('click', () => manda({ t: 'colgar' }));
  $('silencio').addEventListener('click', () => { silenciado = !silenciado; if (local) local.getAudioTracks().forEach((x) => { x.enabled = !silenciado; }); $('silencio').setAttribute('aria-pressed', String(silenciado)); $('silencio').textContent = t(silenciado ? 'sonar' : 'silenciar'); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) manda({ t: 'visto' }); });
  window.addEventListener('pagehide', () => { cerrado = true; if (canal) canal.cierra(); });

  if (directoPosible || relePosible) conecta();
})();
</script>
