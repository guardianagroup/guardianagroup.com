/* This page is only the page: it never talks to guardianagroup.com after loading, and what
   it needs to reach the computer travels after «#», which the browser never sends to anyone.
   Everything said goes directly phone ↔ computer over TLS 1.3 pinned to the computer's own
   certificate (WebTransport) or, where the browser cannot do that (iPhone, iPad) or there is
   no way in, through GUARDIANA's relay (wss://rele.guardianagroup.com), sealed with AES-256-GCM

  const avisaBorrar = (msg) => { const h = $('hoja-borrar'); h.classList.add('si'); $('b-todos').onclick = () => { manda({ t: 'borrar', id: msg.id, para_todos: true }); h.classList.remove('si'); }; $('b-mi').onclick = () => { manda({ t: 'borrar', id: msg.id, para_todos: false }); h.classList.remove('si'); }; $('b-no').onclick = () => h.classList.remove('si'); h.onclick = (e) => { if (e.target === h) h.classList.remove('si'); }; };
  $('respondiendo-no').addEventListener('click', () => { respondiendoA = ''; respondiendoId = null; editandoId = null; $('texto').value = ''; crece(); $('respondiendo').classList.remove('si'); });
  // Big call (16 Oct 2026): the call fills the phone by itself when it connects; «⌄» leaves it
  // as a small card over the chat and the card brings it back. No system full screen: on the
  // iPhone that only showed the other person, never your own picture.
  const plena = (si) => { const c = $('llamada'); c.classList.toggle('plena', si); c.classList.toggle('mini', !si && c.classList.contains('activa')); document.body.classList.toggle('en-llamada', si); };
  $('l-menos').addEventListener('click', () => plena(false));
  $('llamada').addEventListener('click', (e) => { if (!$('llamada').classList.contains('plena') && !e.target.closest('button')) plena(true); });
  const quitaMini = () => $('llamada').classList.remove('mini');
  $('pantalla').addEventListener('click', () => plena(true));
  // Your own picture can be dragged to any corner.
  (() => { const v = $('local'); let p = null, dx = 0, dy = 0;
    v.addEventListener('pointerdown', (e) => { if (!$('llamada').classList.contains('plena')) return; p = { x: e.clientX - dx, y: e.clientY - dy }; v.setPointerCapture(e.pointerId); });
    v.addEventListener('pointermove', (e) => { if (!p) return; dx = e.clientX - p.x; dy = e.clientY - p.y; v.style.setProperty('--dx', dx + 'px'); v.style.setProperty('--dy', dy + 'px'); });
    v.addEventListener('pointerup', () => { p = null; }); v.addEventListener('pointercancel', () => { p = null; }); })();
  // Speaker / earpiece: only where the browser lets a page choose the output (Android Chrome);
  // on the iPhone the system decides (the call plays through the speaker) and the button stays hidden.
  const puedeSalida = !!(HTMLMediaElement.prototype.setSinkId && navigator.mediaDevices && navigator.mediaDevices.enumerateDevices);
  let altavoz = true, salidas = [];
  const pintaAltavoz = () => { $('altavoz').setAttribute('aria-pressed', String(altavoz)); $('altavoz').setAttribute('aria-label', t(altavoz ? 'altavoz' : 'auricular')); $('altavoz').classList.toggle('tachado', !altavoz); };
  const aplicaSalida = async () => { if (!puedeSalida) return; try { if (!salidas.length) salidas = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audiooutput'); const quiero = salidas.find((d) => altavoz ? /speaker|altavoz/i.test(d.label) : /earpiece|auricular|receiver/i.test(d.label)) || (altavoz ? salidas[0] : salidas[1]); if (quiero) await $('remoto').setSinkId(quiero.deviceId); } catch (_) {} };
  $('altavoz').addEventListener('click', () => { altavoz = !altavoz; pintaAltavoz(); aplicaSalida(); });
  // While we call with video, the camera is shown here (not sent yet): the same picture that
  // goes out once the other side answers.
  let previa = null;
  const previaCamara = async (si) => {
    if (!si) { if (previa) { previa.getTracks().forEach((x) => x.stop()); previa = null; if (!local) $('local').srcObject = null; } return; }
    if (previa || local) return;
    try { previa = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 720 } } }); $('local').srcObject = previa; } catch (_) {}
  };
  let camara = 'user';
  $('camara').addEventListener('click', async () => {
    if (!local || !E || !E.llamada || !E.llamada.video) return;
    camara = camara === 'user' ? 'environment' : 'user';
    try {
      const nueva = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: camara }, width: { ideal: 960 }, height: { ideal: 720 } } });
      local.getVideoTracks().forEach((x) => { x.stop(); local.removeTrack(x); });
      nueva.getVideoTracks().forEach((x) => local.addTrack(x));
      $('local').srcObject = local; $('local').classList.toggle('trasera', camara === 'environment');
      reiniciaGrabador(true);
    } catch (_) { nota(t('sin_permiso')); }
  });
  $('silencio').addEventListener('click', () => { silenciado = !silenciado; if (local) local.getAudioTracks().forEach((x) => { x.enabled = !silenciado; }); $('silencio').setAttribute('aria-pressed', String(silenciado)); $('silencio').classList.toggle('tachado', silenciado); $('silencio').setAttribute('aria-label', t(silenciado ? 'sonar' : 'silenciar')); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) manda({ t: 'visto' }); });
  window.addEventListener('pagehide', () => { cerrado = true; if (canal) canal.cierra(); });

  // A preview of the screens with made-up state (only when the code says so; nothing else).
  if (D && D.vista) { window.__vista = { recibe, muestra }; } else if (directoPosible || relePosible) conecta();
})();
