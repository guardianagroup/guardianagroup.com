<style>
/* This page is only the page: it never talks to guardianagroup.com after loading, and what
   it needs to reach the computer travels after «#», which the browser never sends to anyone.
   Everything said goes directly phone ↔ computer over TLS 1.3 pinned to the computer's own
   certificate (WebTransport) or, where the browser cannot do that (iPhone, iPad) or there is
   no way in, through GUARDIANA's relay (wss://rele.guardianagroup.com), sealed with AES-256-GCM
   under keys derived from the key in the QR code: the relay passes bytes it cannot read.
   No analytics, no cookies, no storage. */

@font-face{font-family:'IBM Plex Sans';font-weight:400 600;font-display:swap;src:url(/fonts/IBMPlexSans-400-latin.woff2) format('woff2')}

*{box-sizing:border-box}html,body{margin:0;height:100%}

.mensajes li.mio{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

<body>

    if (relePosible && await porRele(g)) return;

  };

  // ---------- What the computer says ----------
  let E = null, mimeRemoto = null, volvio = false;
  const estadoGlobal = (m) => {
    const id = m.identidad, tr = m.transporte || {}, vistos = m.vigilancia || [];
    if (!id) return 'sin';
    if ((m.sesion || {}).estado === 'pausada' || id.estado === 'clave_cambiada') return 'pausada';
    const perdida = typeof tr.perdida_pct === 'number' ? tr.perdida_pct : 0;
    if (perdida > 8 || vistos.some((s) => s.nivel === 'inusual')) return 'pausada';
    if (vistos.length > 0 || tr.directo === false || perdida >= 3) return 'revisar';
    return 'protegida';
  };
  const recibe = (m) => {
    if (!m || m.tipo !== 'secure_estado') return;
    if (m.movil && m.movil.pendiente && !m.fase) { muestra('p-pendiente'); return; }
    E = m;
    if (volvio) { volvio = false; nota(t('vuelto')); }
    if (m.fase !== 'lista') { muestra('p-error'); $('t-error').textContent = t('fin'); $('t-error-p').textContent = ''; $('reintentar').hidden = true; paraMedios(); return; }
    muestra('p-chat');
    const g = estadoGlobal(m.monitor || {});
    const e = $('estado'); e.hidden = false; e.className = 'estado ' + g;
    $('estado-palabra').textContent = t(g); $('estado-nota').textContent = g === 'protegida' ? t('nota_cifrado') : '';
    if (m.contacto) $('con').textContent = t('con', { n: m.contacto });
    const ol = $('mensajes'); const abajo = ol.scrollTop + ol.clientHeight >= ol.scrollHeight - 40;
    ol.innerHTML = (m.mensajes || []).map((x) => `<li class="${x.mio ? 'mio' : ''}">${esc(x.texto)}<time>${esc(hora(x.t))}</time></li>`).join('') + notas.map((x) => `<li class="nota">${esc(x)}</li>`).join('');
    if (abajo) ol.scrollTop = ol.scrollHeight;
    pintaLlamada(m.llamada);
  };
  const notas = [];
  const nota = (x) => { notas.push(x); if (notas.length > 3) notas.shift(); const ol = $('mensajes'); const li = document.createElement('li'); li.className = 'nota'; li.textContent = x; ol.appendChild(li); ol.scrollTop = ol.scrollHeight; };
  $('form').addEventListener('submit', (e) => { e.preventDefault(); const x = $('texto').value.trim(); if (!x) return; manda({ t: 'texto', texto: x }); $('texto').value = ''; });
  $('reintentar').addEventListener('click', conecta);

  // ---------- Voice and video: the same pieces the computer uses, over the same link ----------
  const FORMATOS = { voz: ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4;codecs=mp4a.40.2', 'audio/mp4'], video: ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4'] };
  const puedeGrabar = !!(window.MediaRecorder && MediaRecorder.isTypeSupported && FORMATOS.voz.some((x) => MediaRecorder.isTypeSupported(x)));
  if (!puedeGrabar) { $('nota-iphone').hidden = false; $('nota-iphone').textContent = t('iphone'); $('voz').disabled = true; $('video').disabled = true; }
  const mime = (video) => { const c = video ? FORMATOS.video : FORMATOS.voz; return (window.MediaRecorder && c.find((x) => MediaRecorder.isTypeSupported(x))) || c[0]; };
  let grabador = null, local = null, fuente = null, buffer = null, pendientes = [], arrancando = false, silenciado = false, wake = null;
  const pintaLlamada = (l) => {
    const caja = $('llamada');
    if (!l) { caja.classList.remove('activa'); $('botones-llamar').hidden = false; paraMedios(); mimeRemoto = null; return; }
    caja.classList.add('activa'); $('botones-llamar').hidden = true;
    caja.classList.toggle('solo-voz', !l.video);
    $('l-estado').textContent = t(l.video ? 'en_video' : 'en_voz', { t: tiempo(Math.max(0, Math.floor(Date.now() / 1000) - (l.desde || 0))) });
    if (puedeGrabar && !grabador && !arrancando) empiezaMedios(!!l.video);
    if (l.mime_remoto && l.mime_remoto !== mimeRemoto) { mimeRemoto = l.mime_remoto; if (fuente) preparaReproductor(mimeRemoto); }
  };
  setInterval(() => { if (E && E.llamada) $('l-estado').textContent = t(E.llamada.video ? 'en_video' : 'en_voz', { t: tiempo(Math.max(0, Math.floor(Date.now() / 1000) - (E.llamada.desde || 0))) }); }, 1000);
  const empiezaMedios = async (video) => {
    arrancando = true;
    preparaReproductor(mimeRemoto || mime(video));
    try {
      local = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: video ? { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 720 } } : false });
    } catch (_) { arrancando = false; nota(t('sin_permiso')); manda({ t: 'colgar' }); return; }
    $('local').srcObject = local;
    $('remoto').play().catch(() => {});
    grabador = new MediaRecorder(local, { mimeType: mime(video), audioBitsPerSecond: 64000, videoBitsPerSecond: video ? 1000000 : undefined });
    grabador.ondataavailable = async (e) => { if (e.data && e.data.size && canal) { try { canal.envia(1, new Uint8Array(await e.data.arrayBuffer())); } catch (_) {} } };
    grabador.start(120);
    arrancando = false;
    manda({ t: 'llamar', video, mime: grabador.mimeType || mime(video) });
    try { wake = await navigator.wakeLock.request('screen'); } catch (_) {}
  };
  const preparaReproductor = (tipo) => {
    const v = $('remoto');
    const MS = window.ManagedMediaSource || window.MediaSource;
    if (!MS) return;
    fuente = new MS();
    v.disableRemotePlayback = true;
    v.src = URL.createObjectURL(fuente);
    buffer = null; pendientes = [];
    fuente.addEventListener('sourceopen', () => { try { buffer = fuente.addSourceBuffer(tipo); buffer.mode = 'sequence'; buffer.addEventListener('updateend', vacia); vacia(); } catch (_) {} });
    v.play().catch(() => {});
  };
  const vacia = () => {
    if (!buffer || buffer.updating || !pendientes.length) return;
    try { buffer.appendBuffer(pendientes.shift()); } catch (_) { pendientes = []; }
    const v = $('remoto');
    try { if (v.buffered.length && v.buffered.end(v.buffered.length - 1) - v.currentTime > 0.9) v.currentTime = v.buffered.end(v.buffered.length - 1) - 0.25; } catch (_) {}
  };
  const trozoRemoto = (u8) => { if (!fuente && E && E.llamada) preparaReproductor(mimeRemoto || mime(!!E.llamada.video)); pendientes.push(u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength)); vacia(); };
  const paraMedios = () => {
    try { if (grabador && grabador.state !== 'inactive') grabador.stop(); } catch (_) {}
    grabador = null;
    if (local) { local.getTracks().forEach((x) => x.stop()); local = null; }
    $('local').srcObject = null;
    try { if (fuente && fuente.readyState === 'open') fuente.endOfStream(); } catch (_) {}
    fuente = null; buffer = null; pendientes = []; arrancando = false;
    $('remoto').removeAttribute('src');
    if (wake) { try { wake.release(); } catch (_) {} wake = null; }
  };
  $('voz').addEventListener('click', () => { manda({ t: 'llamar', video: false, mime: mime(false) }); });
  $('video').addEventListener('click', () => { manda({ t: 'llamar', video: true, mime: mime(true) }); });
  $('colgar').addEventListener('click', () => manda({ t: 'colgar' }));
  $('silencio').addEventListener('click', () => { silenciado = !silenciado; if (local) local.getAudioTracks().forEach((x) => { x.enabled = !silenciado; }); $('silencio').setAttribute('aria-pressed', String(silenciado)); $('silencio').textContent = t(silenciado ? 'sonar' : 'silenciar'); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) manda({ t: 'visto' }); });
  window.addEventListener('pagehide', () => { cerrado = true; if (canal) canal.cierra(); });

  if (directoPosible || relePosible) conecta();
})();
</script>
</body>
</html>
