<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#1B2C44"/>
      <stop offset=".45" stop-color="#0C1520"/>
      <stop offset="1" stop-color="#04060A"/>
    </radialGradient>
    <linearGradient id="brilloFondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9CC3E4" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#9CC3E4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9CC3E4" stop-opacity="0"/>
    </radialGradient>
    <!-- arco: metal cilíndrico (luz a la izquierda) -->
    <linearGradient id="arco" gradientUnits="userSpaceOnUse" x1="26" y1="0" x2="74" y2="0">
      <stop offset="0" stop-color="#AFC0D0"/>
      <stop offset=".16" stop-color="#FFFFFF"/>
      <stop offset=".34" stop-color="#E4EBF2"/>
      <stop offset=".66" stop-color="#C7D3DE"/>
      <stop offset=".84" stop-color="#F3F7FA"/>
      <stop offset="1" stop-color="#8FA3B6"/>
    </linearGradient>
    <linearGradient id="arcoSombra" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="46">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
    <!-- cuerpo: acero claro, más luz arriba -->
    <linearGradient id="cuerpo" gradientUnits="userSpaceOnUse" x1="0" y1="42" x2="0" y2="92">
      <stop offset="0" stop-color="#D9EAF7"/>
      <stop offset=".22" stop-color="#AFD0EC"/>
      <stop offset=".62" stop-color="#8DB6DA"/>
      <stop offset="1" stop-color="#6E97BE"/>
    </linearGradient>
    <linearGradient id="filo" gradientUnits="userSpaceOnUse" x1="0" y1="42" x2="0" y2="92">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1A2A" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="reflejo" gradientUnits="userSpaceOnUse" x1="17" y1="42" x2="62" y2="80">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
      <stop offset=".51" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- la G grabada: hueco oscuro con sombra por dentro -->
    <linearGradient id="hueco" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="84">
      <stop offset="0" stop-color="#0A1420"/>
      <stop offset="1" stop-color="#1D3550"/>
    </linearGradient>
    <filter id="sombra" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.6"/>
      <feOffset dy="3.2" result="s"/>
      <feFlood flood-color="#000" flood-opacity=".7"/>
      <feComposite in2="s" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dentro" x="-20%" y="-20%" width="140%" height="140%">
      <!-- sombra interior: el borde de arriba del hueco más oscuro, el de abajo con un hilo de luz -->
      <feOffset in="SourceAlpha" dy="1.1" result="o"/>
      <feGaussianBlur in="o" stdDeviation=".7" result="ob"/>
      <feComposite in="SourceAlpha" in2="ob" operator="out" result="borde"/>
      <feFlood flood-color="#000" flood-opacity=".75"/>
      <feComposite in2="borde" operator="in" result="sombraDentro"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sombraDentro"/></feMerge>
    </filter>
    <filter id="difuso" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="recorte"><rect width="100" height="100" rx="0"/></clipPath>
    <clipPath id="cuerpoClip"><rect x="17" y="42" width="66" height="50" rx="13"/></clipPath>
  </defs>
  <g clip-path="url(#recorte)">
    <rect width="100" height="100" fill="url(#fondo)"/>
    <rect width="100" height="100" fill="url(#brilloFondo)"/>
    <g transform="translate(10 7) scale(0.8)">
      <ellipse cx="50" cy="62" rx="44" ry="40" fill="url(#aura)" filter="url(#difuso)"/>
      <g filter="url(#sombra)">
        <path d="M31 45 V31 A19 19 0 0 1 69 31 V45" fill="none" stroke="url(#arco)" stroke-width="9.2" stroke-linecap="butt"/>
        <path d="M31 45 V35 M69 45 V35" fill="none" stroke="url(#arcoSombra)" stroke-width="9.2"/>
        <rect x="17" y="42" width="66" height="50" rx="13" fill="url(#cuerpo)"/>
      </g>
      <g clip-path="url(#cuerpoClip)">
        <rect x="17" y="42" width="66" height="50" rx="13" fill="url(#reflejo)"/>
      </g>
      <rect x="17.45" y="42.45" width="65.1" height="49.1" rx="12.6" fill="none" stroke="url(#filo)" stroke-width=".9"/>
      <g filter="url(#dentro)">
        <path d="M63 58.29 V55.07 Q63 54 58.71 54 H44.15 Q37 54 37 61.15 V72.85 Q37 80 44.15 80 H58.71 Q63 80 63 75.71 V67 H51" fill="none" stroke="url(#hueco)" stroke-width="7.5"/>
      </g>
    </g>
  </g>
</svg>