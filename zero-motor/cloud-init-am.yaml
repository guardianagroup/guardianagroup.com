#cloud-config
# GUARDIANA ZERO · motor de América (Miami): pega este texto como «user data» / cloud-init al (re)instalar el servidor
# (Ubuntu 24.04). Antes: registro DNS A de motor-am.guardianagroup.com → IP del servidor. Se instala solo (5–8 min) y se
# mantiene actualizado desde el repositorio. Registro: /var/log/zero-instalacion.log
runcmd:
  - [bash, -c, "curl -fsSL https://raw.githubusercontent.com/guardianagroup/guardianagroup.com/main/zero-motor/instalar.sh | bash -s -- motor-am.guardianagroup.com 'América · Miami' > /var/log/zero-instalacion.log 2>&1"]
