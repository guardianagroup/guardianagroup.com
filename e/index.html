/* «Sala de entrega» (18 Oct 2026): the receiver's side. This page is only the page: it never talks
   to guardianagroup.com after loading. What it needs travels after «#», which a browser never
   sends: the delivery's 256-bit key and the relay's name. It meets the sender's computer through
   GUARDIANA's relay, with a fresh ECDH P-256 secret mixed with that key (HKDF-SHA256, AES-256-GCM,
   numbered frames): the relay passes bytes it cannot read. The files' keys arrive only after the
   right code; each 1 MiB piece is opened and checked here (AES-256-GCM, STREAM), and the file's
   hash tree (RFC 6962) is compared with the sender's before it counts as received. At the end
   this browser signs the receipt with a key of its own (ECDSA P-256), and the sender adds its
   signature. No cookies, no analytics, no storage but the tab's own token for a resume. */

          plano = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonceDe(a.prefijo, pieza.n, pieza.ultimo), additionalData: aadDe(a.i), tagLength: 128 }, a.clave, pieza.datos));
        } catch (_) { E.mal++; a.mal = true; pinta(); manda({ t: 'pide', i: a.i, desde: a.hechos, cuantos: 0, ok: E.ok, mal: E.mal }); return false; }
        if (pieza.ultimo !== (pieza.n + 1 === a.trozos)) { E.mal++; a.mal = true; pinta(); return false; }
        await a.destino.escribe(plano);
        a.hojas.push(await sha(une(Uint8Array.of(0), plano)));
        a.hechos++; E.ok++;
        pinta();
      }
    }
    if (terminado) return false;
    const r = hex(await raiz(a.hojas));
    if (r !== a.raiz) { E.mal++; a.mal = true; pinta(); return false; }
    await a.destino.cierra();
    a.ok = true; pinta();
    manda({ t: 'recibido', i: a.i, raiz: r });
    return true;
  };

  $('descargar').addEventListener('click', async () => {
    $('descargar').disabled = true;
    await eligeCarpeta();
    for (const a of manifiesto.archivos) { if (!a.ok && !(await bajaArchivo(a))) break; }
  });

  // The receipt: signed here with a fresh P-256 key, then by the sender.
  let reciboFinal = null;
  const huella = async (clave) => { const h = hex(await sha(clave)).slice(0, 32).toUpperCase(); return h.match(/..../g).join(' '); };
  const firmaRecibo = async (contenido) => {
    const par = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']);
    const firma = new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, par.privateKey, enc(contenido)));
    const clave = new Uint8Array(await crypto.subtle.exportKey('raw', par.publicKey));
    manda({ t: 'acuse', clave: b64(clave), firma: b64(firma) });
  };
  const muestraRecibo = async (json) => {
    reciboFinal = json;
    const r = JSON.parse(json);
    const clave = de64(r.clave);
    const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, await crypto.subtle.importKey('raw', clave, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']), de64(r.firma), enc(r.contenido));
    $('p-recibo').hidden = !ok;
    $('recibo-huella').textContent = t('huella', { h: await huella(clave) });
  };
  $('recibo-bajar').addEventListener('click', () => {
    if (!reciboFinal) return;
    const u = URL.createObjectURL(new Blob([reciboFinal], { type: 'application/json' }));
    const x = document.createElement('a'); x.href = u; x.download = 'guardiana-recibo-entrega-' + D.i + '.json'; document.body.appendChild(x); x.click(); setTimeout(() => { URL.revokeObjectURL(u); x.remove(); }, 4000);
  });

  const alJSON = async (v) => {
    if (v.t === 'hola') { muestra(manifiesto ? 'p-archivos' : 'p-codigo'); if (token) manda({ t: 'codigo', codigo: sessionStorage.getItem(TOKEN + '-c') || '', token }); return; }
    if (v.t === 'codigo_mal') { $('codigo-mal').hidden = false; $('codigo-mal').textContent = t('mal', { n: v.quedan }); $('codigo-ok').disabled = false; return; }
    if (v.t === 'manifiesto') {
      token = v.token || token; try { sessionStorage.setItem(TOKEN, token); } catch (_) {}
      E.codigo = true;
      if (!manifiesto) {
        manifiesto = v;
        manifiesto.archivos.forEach((a) => { a.clave_b64 = a.clave; a.clave = null; a.prefijo = de64(a.prefijo); });
        $('nota-tamano').hidden = !!window.showDirectoryPicker || !manifiesto.archivos.some((a) => a.bytes > 1024 * 1024 * 1024);
        $('nota-tamano').textContent = t('grande');
      }
      muestra('p-archivos'); pinta();
      // A resume after a cut: the transfer goes on by itself.
      if ($('descargar').disabled) for (const a of manifiesto.archivos) { if (!a.ok && !(await bajaArchivo(a))) break; }
      return;
    }
    if (v.t === 'reinicia') { for (const [k, r] of esperas) if (k.startsWith(v.i + ':')) r('reinicia'); return; }
    if (v.t === 'recibo') { await firmaRecibo(v.contenido); return; }
    if (v.t === 'recibo_final') { await muestraRecibo(v.recibo); return; }
    if (v.t === 'fin') {
      if (v.motivo === 'entregada' && reciboFinal) { $('p-fin').hidden = false; $('fin').textContent = t('fin_entregada'); terminado = true; return; }
      fin(v.motivo);
    }
  };
  const alTrozo = (b) => {
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    const i = dv.getUint32(0), n = dv.getUint32(4), ultimo = b[8] === 1;
    const r = esperas.get(i + ':' + n);
    if (r) { esperas.delete(i + ':' + n); r({ n, ultimo, datos: b.slice(9) }); }
  };

  $('codigo-ok').addEventListener('click', () => {
    const c = $('codigo').value.replace(/\D/g, '');
    if (c.length < 4) return;
    $('codigo-ok').disabled = true; $('codigo-mal').hidden = true;
    try { sessionStorage.setItem(TOKEN + '-c', c); } catch (_) {}
    manda({ t: 'codigo', codigo: c, token });
  });
  $('codigo').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('codigo-ok').click(); });

  const conecta = async () => {
    if (terminado) return;
    const sala = hex(await sha(une(enc('guardiana-entrega-sala'), K))).slice(0, 32);
    const esquema = /^(127\.|localhost)/.test(D.r) ? 'ws://' : 'wss://';
    let listo = false;
    try { ws = new WebSocket(esquema + D.r + '/m/' + sala); } catch (_) { setTimeout(conecta, 4000); return; }
    ws.binaryType = 'arraybuffer';
    nSale = 1; nEntra = 0;
    const espera = setTimeout(() => { if (!listo) { $('conectando').textContent = t('no_esta'); try { ws.close(); } catch (_) {} } }, 60000);
    ws.onmessage = (ev) => {
      colaEntra = colaEntra.then(async () => {
        const d = new Uint8Array(ev.data);
        if (!listo) {
          if (d.length !== 3 + 16 + 65 || d[0] !== 71 || d[1] !== 77 || d[2] !== 50) { ws.close(); return; }
          const delMovil = crypto.getRandomValues(new Uint8Array(16));
          const par = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
          const suya = await crypto.subtle.importKey('raw', d.slice(19), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
          const secreto = new Uint8Array(await crypto.subtle.deriveBits({ name: 'ECDH', public: suya }, par.privateKey, 256));
          const mia = new Uint8Array(await crypto.subtle.exportKey('raw', par.publicKey));
          [kme, kem] = await claves(d.slice(3, 19), delMovil, secreto);
          ws.send(une(delMovil, mia, await sella(kme, 0, enc('GM2'), enc('hola'))));
          listo = true; clearTimeout(espera);
          return;
        }
        const plano = await abre(kem, nEntra++, new Uint8Array(0), d);
        if (plano[0] === 0) await alJSON(JSON.parse(new TextDecoder().decode(plano.slice(1))));
        else if (plano[0] === 2) alTrozo(plano.slice(1));
      }).catch(() => { try { ws.close(); } catch (_) {} });
    };
    ws.onclose = () => {
      clearTimeout(espera);
      // Pieces in flight are asked again after the cut, from where this page is.
      for (const r of esperas.values()) r(null);
      esperas.clear();
      if (!terminado) { muestra(manifiesto ? 'p-archivos' : 'p-conectando'); setTimeout(conecta, listo ? 1500 : 4000); }
    };
    ws.onerror = () => {};
  };
  conecta();
})();
</script>
