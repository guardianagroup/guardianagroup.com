# Conectividad por país para la ficha de Órbita (ronda 94; el dueño, 17 nov 2026): el porcentaje de personas que usan
# internet (Banco Mundial, dato de la UIT, CC BY 4.0) y las medianas mensuales de M-Lab (CC0 1.0), copiados a nuestro
# sitio (orbita/datos/conectividad.json). Una vez por semana: el Banco Mundial publica una vez al año y M-Lab, una vez al mes.
name: Conectividad por país

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conectividad
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Banco Mundial y M-Lab
        run: |
          pip install --quiet pandas pyarrow
          python3 herramientas/conectividad.py

      - name: Guardar si ha cambiado
        run: |
          git config user.name "GUARDIANA datos"
          git config user.email "datos@guardianagroup.com"
          git add orbita/datos/conectividad.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Órbita: conectividad por país actualizada ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
