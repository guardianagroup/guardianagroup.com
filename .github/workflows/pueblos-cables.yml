# The towns where the submarine cables reach land (owner, 23 Oct 2026, 23:39: «todo cable que… empiece o termine en
# un pueblo, tiene que aparecer el nombre»). GeoNames cities500 (CC BY 4.0) is downloaded here, the places less than
# 25 km from a cable's end are kept in orbita/static/tierra/pueblos-cables.tsv, and lugares_capas.py names every landing
# with them; and the towns the agency's land backbones pass through (pueblos_fibra.py), so fibra_agencia.py can place
# them. By hand, and every Monday (new cables bring new landings).
name: Pueblos donde llegan los cables

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: write

concurrency:
  group: datos-orbita
  cancel-in-progress: false

jobs:
  pueblos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: GeoNames cities500 (CC BY 4.0)
        run: |
          curl -sSfL --retry 3 -o /tmp/cities500.zip https://download.geonames.org/export/dump/cities500.zip
          unzip -o -q /tmp/cities500.zip -d /tmp/geonames
          wc -l /tmp/geonames/cities500.txt

      - name: Pueblos junto a los cables y nombre de cada llegada
        run: |
          python3 herramientas/pueblos_cables.py /tmp/geonames/cities500.txt
          python3 herramientas/lugares_capas.py
          python3 herramientas/pueblos_fibra.py /tmp/geonames/cities500.txt

      - name: Guardar si ha cambiado
        run: |
          git config user.name "GUARDIANA datos"
          git config user.email "datos@guardianagroup.com"
          git add orbita/static/tierra/pueblos-cables.tsv orbita/datos/lugares-capas.json herramientas/fuentes/pueblos-fibra.tsv
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Órbita: pueblos donde llegan los cables, de GeoNames cities500 ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
