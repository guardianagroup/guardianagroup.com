# Real data for Órbita's planet, mirrored on our own site (owner, 20 Oct 2026):
# communication satellites from CelesTrak every 6 hours, submarine cables from OpenStreetMap weekly,
# and satellite.js (SGP4, MIT) bundled into orbita/static/vendor so the page loads nothing from third parties.
name: Datos reales de Órbita

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [orbita-datos]
    paths:
      - '.github/workflows/datos-orbita.yml'
      - 'herramientas/datos_orbita.py'

permissions:
  contents: write

concurrency:
  group: datos-orbita
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: satellite.js (SGP4), copied into our site
        run: |
          set -e
          if [ ! -f orbita/static/vendor/satellite.min.js ]; then
            mkdir -p /tmp/sjs && cd /tmp/sjs
            npm init -y >/dev/null
            npm install --no-audit --no-fund satellite.js@6 esbuild@0.24.0
            V=$(node -p "require('./node_modules/satellite.js/package.json').version")
            echo "export * from 'satellite.js';" > entrada.mjs
            npx esbuild entrada.mjs --bundle --format=iife --global-name=satellite --minify --outfile=satellite.min.js
            node -e "global.window=global;require('./satellite.min.js');console.log('exporta:',Object.keys(satellite).join(','))" || true
            mkdir -p "$GITHUB_WORKSPACE/orbita/static/vendor"
            { echo "/*! satellite.js $V · MIT License · https://github.com/shashwatak/satellite-js */"; cat satellite.min.js; } > "$GITHUB_WORKSPACE/orbita/static/vendor/satellite.min.js"
            cp node_modules/satellite.js/LICENSE* "$GITHUB_WORKSPACE/orbita/static/vendor/satellite-LICENSE.txt" 2>/dev/null || true
          fi

      - name: Satélites (CelesTrak) y cables (OpenStreetMap)
        run: python3 herramientas/datos_orbita.py satelites cables

      - name: Guardar si ha cambiado
        run: |
          git config user.name "GUARDIANA datos"
          git config user.email "datos@guardianagroup.com"
          git add orbita/datos orbita/static/vendor
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Órbita: datos reales actualizados ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
