# Real data for Órbita's planet, mirrored on our own site (owner, 20 Oct 2026):
# communication satellites from CelesTrak every 6 hours, submarine cables from OpenStreetMap weekly,
# and satellite.js (SGP4, MIT) bundled into orbita/static/vendor so the page loads nothing from third parties.
name: Datos reales de Órbita

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Volver a descargar también los cables y los puntos (centros de datos) aunque no toque por fecha'
        type: boolean
        default: false
  push:
    branches: [orbita-datos]
    paths:
      - '.github/workflows/datos-orbita.yml'
      - 'herramientas/datos_orbita.py'
      - 'herramientas/fibra_tierra.py'
      - 'herramientas/lugares_capas.py'
      - 'herramientas/llegadas_tierra.py'
      - 'herramientas/mapa_16k.py'
      - 'herramientas/relieve.py'

permissions:
  contents: write

concurrency:
  group: datos-orbita
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: satellite.js (SGP4), copied into our site
        run: |
          set -e
          if [ ! -f orbita/static/vendor/satellite.min.js ]; then
            mkdir -p /tmp/sjs && cd /tmp/sjs
            npm init -y >/dev/null
            npm install --no-audit --no-fund satellite.js@6 esbuild@0.24.0
            V=$(node -p "require('./node_modules/satellite.js/package.json').version")
            echo "export * from 'satellite.js';" > entrada.mjs
            npx esbuild entrada.mjs --bundle --format=iife --global-name=satellite --minify --outfile=satellite.min.js
            node -e "global.window=global;require('./satellite.min.js');console.log('exporta:',Object.keys(satellite).join(','))" || true
            mkdir -p "$GITHUB_WORKSPACE/orbita/static/vendor"
            { echo "/*! satellite.js $V · MIT License · https://github.com/shashwatak/satellite-js */"; cat satellite.min.js; } > "$GITHUB_WORKSPACE/orbita/static/vendor/satellite.min.js"
            cp node_modules/satellite.js/LICENSE* "$GITHUB_WORKSPACE/orbita/static/vendor/satellite-LICENSE.txt" 2>/dev/null || true
          fi

      - name: Satélites (CelesTrak) y cables (OpenStreetMap)
        timeout-minutes: 15
        run: pip install --quiet pillow && python3 herramientas/datos_orbita.py satelites cables ${{ (github.event_name == 'push' || inputs.forzar) && 'forzar' || '' }}

      # Each OpenStreetMap job on its own, with its own limit: if one is slow, the others are still saved.
      - name: Puntos de internet (OpenStreetMap, una vez por semana)
        timeout-minutes: 8
        continue-on-error: true
        run: pip install --quiet pillow && (python3 herramientas/datos_orbita.py puntos ${{ (github.event_name == 'push' || inputs.forzar) && 'forzar' || '' }} 2>&1 | tee orbita/datos/puntos.log)

      - name: Fibra de tierra, borrador y medida (OpenStreetMap, solo a mano o al cambiar la herramienta)
        if: github.event_name != 'schedule'
        timeout-minutes: 25
        continue-on-error: true
        run: pip install --quiet pillow && python3 herramientas/datos_orbita.py tierra medir

      # 22 Oct 2026 (owner: «las redes troncales de tierra, las principales… búscalo por todo internet»):
      # AfTerFibre (CC BY 4.0), the OFDS public data and OpenStreetMap, joined in one file
      - name: Fibra troncal por tierra (a mano o al cambiar la herramienta; GitHub no admite «%» en las expresiones)
        if: github.event_name != 'schedule'
        timeout-minutes: 20
        continue-on-error: true
        run: pip install --quiet pillow && python3 herramientas/fibra_tierra.py --sin-ofds

      # 22 Oct 2026 (owner, plan B): the cables OpenStreetMap lacks, rebuilt by the agency from public sources
      - name: Cables reconstruidos por la agencia
        timeout-minutes: 30
        continue-on-error: true
        run: pip install --quiet pillow && python3 herramientas/cables_agencia.py

      # 25 Oct 2026, 19:01 (owner: «los cables no llegan a tierra»): every end in the water within 8 km of the coast of
      # OpenStreetMap (static/tierra/costa-osm) is taken to the shore, before the landings are named
      - name: Cables hasta tierra (costa de OpenStreetMap)
        timeout-minutes: 10
        continue-on-error: true
        run: python3 herramientas/llegadas_tierra.py

      - name: Ciudades de cables y centros de datos
        timeout-minutes: 10
        continue-on-error: true
        run: python3 herramientas/lugares_capas.py

      # 22 Oct 2026 (owner: «la profundidad a la que está el cable submarino, y también el de tierra»): the seabed and the
      # land under every line, from ETOPO 2022 (NOAA, public domain), cached between runs (about 470 MB)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/etopo
          key: etopo-2022-60s-surface
      - name: Profundidad y altitud bajo cables y fibra (ETOPO 2022)
        timeout-minutes: 25
        continue-on-error: true
        run: pip install --quiet numpy netCDF4 && python3 herramientas/relieve.py

      # 22 Oct 2026 (owner: «un zoom o dos más, sin perder calidad»): the day map at 16K in tiles, from NASA
      # (public domain). Only when the tool changes or by hand: the file is big and the image does not change.
      - name: Mapa de día 16K en mosaico (solo a mano o al cambiar la herramienta)
        if: github.event_name != 'schedule'
        timeout-minutes: 20
        continue-on-error: true
        run: |
          if [ -f orbita/static/tierra/dia-16k/7_3.jpg ]; then echo "Ya está"; exit 0; fi
          pip install --quiet pillow && python3 herramientas/mapa_16k.py

      - name: Guardar si ha cambiado
        if: always()
        run: |
          git config user.name "GUARDIANA datos"
          git config user.email "datos@guardianagroup.com"
          git add orbita/datos orbita/static/vendor orbita/static/tierra/dia-16k
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Órbita: datos reales actualizados ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
